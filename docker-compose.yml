version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: boreal_web:latest
    # Next.js hornea las NEXT_PUBLIC_* en el bundle del cliente durante `npm run build`:
    # ponerlas solo en `environment` no alcanza, el navegador nunca las ve. Por eso van
    # también como build args (el Dockerfile las declara con ARG).
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://31.220.86.94:5000
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    environment:
      NODE_ENV: production
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://31.220.86.94:5000
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    ports:
      - "4000:4000"
    networks:
      - truconet
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

  backend:
    image: boreal_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: http://31.220.86.94:4000
      # Sin esto, src/auth/firebaseAdmin.ts tira "Falta la variable de entorno
      # FIREBASE_PROJECT_ID" en cada verifyIdToken() y requireAuth responde 401
      # "Token inválido o expirado" en /me, /history y /analyze.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_READ_MODEL: ${GEMINI_READ_MODEL}
    ports:
      - "5000:8080"
    networks:
      - truconet
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  pgdata:

networks:
  truconet:
    external: true
  boreal-internal-net:
    driver: overlay
