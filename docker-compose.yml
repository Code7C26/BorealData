version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: boreal_web:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://31.220.86.94:5000
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    networks:
      - truconet
      - boreal-internal-net
      - Kobacnet  # <--- Conectado a la red de Traefik
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.aletheia-web.rule=Host(`aletheiainc.online`) || Host(`www.aletheiainc.online`)"
        - "traefik.http.routers.aletheia-web.entrypoints=websecure"
        - "traefik.http.routers.aletheia-web.tls.certresolver=letsencrypt" # (Asegúrate de que tu Traefik use 'letsencrypt' o cámbialo por el nombre de tu resolver)
        - "traefik.http.services.aletheia-web.loadbalancer.server.port=4000"

  backend:
    image: boreal_backend:latest
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: http://31.220.86.94:4000
    ports:
      - "5000:8080"
    networks:
      - truconet
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  pgdata:

networks:
  truconet:
    external: true
  boreal-internal-net:
    driver: overlay
  Kobacnet:
    external: true  # <--- Declarada correctamente como externa