version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - boreal-internal-net
    deploy:
      restart_policy:
        condition: on-failure

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://31.220.86.94:5000
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    image: boreal_web:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://31.220.86.94:5000
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    networks:
      - truconet
      - boreal-internal-net
      - Kobacnet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.aletheia-web.rule=Host(`aletheiainc.online`) || Host(`www.aletheiainc.online`)"
        - "traefik.http.routers.aletheia-web.entrypoints=websecure"
        - "traefik.http.routers.aletheia-web.tls=true"
        - "traefik.http.routers.aletheia-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.aletheia-web.loadbalancer.server.port=4000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: boreal_backend:latest
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: https://aletheiainc.online
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_READ_MODEL: ${GEMINI_READ_MODEL}
    networks:
      - truconet
      - boreal-internal-net
      - Kobacnet  # <--- Conectado a Traefik
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.aletheia-api.rule=Host(`aletheiainc.online`) && PathPrefix(`/api`)"
        - "traefik.http.routers.aletheia-api.entrypoints=websecure"
        - "traefik.http.routers.aletheia-api.tls=true"
        - "traefik.http.routers.aletheia-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.aletheia-api.loadbalancer.server.port=8080"

volumes:
  pgdata:

networks:
  truconet:
    external: true
  boreal-internal-net:
    driver: overlay
  Kobacnet:
    external: true
    name: Kobacnet