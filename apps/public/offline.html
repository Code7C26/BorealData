<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b100f" />
    <title>Sin conexión — AletheIA</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b100f; color: #f2e8d5; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
      }
      main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 0; font-size: 1.4rem; }
      p { margin: 0; color: #b9b3a6; line-height: 1.5; }
      button {
        margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 22px;
        background: #7a5af8; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon/192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Para verificar una nota AletheIA necesita internet. Revisá tu conexión y probá de nuevo.</p>
      <p lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
